<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedro H. M. Torres</title>
    <meta name="description" content="Pedro Henrique Monteiro Torres — researcher and professor in computational structural biology, drug design and bioinformatics (UFRJ). Software and teaching materials.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ===== LIGHT MODE ===== */
        /* #b3b833 is decorative only (borders/dots). Text accents use #6c7010 (5:1 on white). */
        :root {
            --primary:       #26280a;
            --accent:        #6c7010;
            --accent-vivid:  #b3b833;
            --accent-light:  #f0f1cc;
            --text:          #1c1e08;
            --text-light:    #565820;
            --border:        #d2d468;
            --bg:            #f4f4db;
            --card:          #ffffff;
            --header-from:   #1c1e06;
            --header-to:     #484a14;
            --shadow:        rgba(26, 28, 8, 0.13);
            --toggle-bg:     #6c7010;
            --toggle-color:  #ffffff;
            --icon-bg:       #6c7010;
            --icon-color:    #ffffff;
        }

        /* ===== DARK MODE ===== */
        /* Background is near-black neutral. Only accents (#b3b833) carry the color. */
        [data-theme="dark"] {
            --primary:       #f0f0f0;
            --accent:        #b3b833;
            --accent-vivid:  #b3b833;
            --accent-light:  #1e1e1e;
            --text:          #e0e0e0;
            --text-light:    #888888;
            --border:        #2a2a2a;
            --bg:            #0d0d0d;
            --card:          #161616;
            --header-from:   #0d0d0d;
            --header-to:     #1c1c1c;
            --shadow:        rgba(0, 0, 0, 0.65);
            --toggle-bg:     #b3b833;
            --toggle-color:  #0d0d0d;
            --icon-bg:       #222222;
            --icon-color:    #b3b833;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.7;
            color: var(--text);
            background-color: var(--bg);
            padding: 30px 20px;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        /* ===== CONTROLS ===== */
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
        }

        .theme-toggle {
            width: 38px;
            height: 26px;
            background: var(--toggle-bg);
            color: var(--toggle-color);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.82em;
            box-shadow: 0 2px 8px var(--shadow);
            transition: background 0.3s, color 0.3s, transform 0.2s;
        }

        .theme-toggle:hover { transform: scale(1.1); }

        .language-flag {
            width: 38px;
            height: 26px;
            cursor: pointer;
            border-radius: 5px;
            border: 2px solid transparent;
            box-shadow: 0 2px 8px var(--shadow);
            object-fit: cover;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .language-flag:hover { transform: scale(1.1); }
        .language-flag.active {
            border-color: var(--accent-vivid);
            box-shadow: 0 0 0 3px rgba(179, 184, 51, 0.35);
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 880px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 32px var(--shadow);
            transition: background 0.3s, box-shadow 0.3s;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, var(--header-from) 0%, var(--header-to) 100%);
            padding: 44px 44px 40px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 32px;
            position: relative;
            overflow: hidden;
            transition: background 0.3s;
        }

        .header::after {
            content: '';
            position: absolute;
            top: -60px; right: -60px;
            width: 300px; height: 300px;
            background: rgba(255,255,255,0.04);
            border-radius: 50%;
            pointer-events: none;
        }

        .profile-pic {
            width: 130px; height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255,255,255,0.82);
            box-shadow: 0 6px 24px rgba(0,0,0,0.4);
            flex-shrink: 0;
            position: relative; z-index: 1;
        }

        .header-info { position: relative; z-index: 1; }

        .header-info h1 {
            font-size: 1.9em;
            font-weight: 700;
            letter-spacing: -0.4px;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .header-info h2 {
            font-size: 1em;
            font-weight: 400;
            opacity: 0.75;
            margin-bottom: 14px;
        }

        .header-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-links a {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 13px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.22);
            color: #fff;
            text-decoration: none;
            font-size: 0.8em;
            font-weight: 500;
            transition: background 0.2s, transform 0.2s;
        }

        .header-links a:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        /* ===== CONTENT ===== */
        .content { padding: 38px 44px 44px; }

        .section-title {
            font-size: 0.7em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            color: var(--accent);
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent-light);
            transition: color 0.3s, border-color 0.3s;
        }

        .section-gap { margin-top: 42px; }

        .about-text {
            font-size: 0.975em;
            line-height: 1.85;
            margin-bottom: 22px;
            color: var(--text);
        }

        .keywords-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .keyword-tag {
            background: var(--accent-light);
            color: var(--accent);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 0.8em;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        /* ===== REPO CARDS ===== */
        .repo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .repo-card {
            display: flex;
            gap: 14px;
            padding: 18px 20px;
            background: var(--accent-light);
            border-radius: 11px;
            text-decoration: none;
            color: var(--text);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent-vivid);
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }

        .repo-card:hover {
            border-color: var(--accent-vivid);
            transform: translateY(-3px);
            box-shadow: 0 6px 18px var(--shadow);
        }

        .repo-icon {
            width: 42px; height: 42px;
            background: var(--icon-bg);
            color: var(--icon-color);
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05em;
            flex-shrink: 0;
            transition: background 0.3s, color 0.3s;
        }

        .repo-body { min-width: 0; }

        .repo-name {
            font-size: 0.98em;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 3px;
            transition: color 0.3s;
        }

        .repo-name .arrow {
            color: var(--accent);
            font-size: 0.8em;
            opacity: 0;
            transform: translateX(-4px);
            transition: opacity 0.2s, transform 0.2s;
        }

        .repo-card:hover .arrow { opacity: 1; transform: translateX(0); }

        .repo-desc {
            font-size: 0.85em;
            line-height: 1.55;
            color: var(--text-light);
        }

        .repo-card.featured {
            grid-column: 1 / -1;
        }

        /* ===== FOOTER ===== */
        .footer {
            padding: 26px 44px 34px;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-light);
            font-size: 0.82em;
        }

        .footer a { color: var(--accent); text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        /* Responsive */
        @media (max-width: 620px) {
            body { padding: 10px; }
            .header { flex-direction: column; text-align: center; padding: 32px 24px 28px; }
            .header-links { justify-content: center; }
            .content { padding: 28px 22px; }
            .repo-grid { grid-template-columns: 1fr; }
            .footer { padding: 22px; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark/light mode">
            <i class="fas fa-moon" id="theme-icon"></i>
        </button>
        <img src="https://flagcdn.com/w40/br.png" class="language-flag" id="flag-pt" onclick="setLanguage('pt')" alt="Português">
        <img src="https://flagcdn.com/w40/us.png" class="language-flag" id="flag-en" onclick="setLanguage('en')" alt="English">
    </div>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <img src="foto.jpg" alt="Pedro Henrique Monteiro Torres" class="profile-pic">
            <div class="header-info">
                <h1>Pedro Henrique Monteiro Torres</h1>
                <h2 data-i18n="role"></h2>
                <div class="header-links">
                    <a href="https://github.com/monteirotorres" target="_blank"><i class="fab fa-github"></i> GitHub</a>
                    <a href="https://monteirotorres.github.io/cv/" target="_blank"><i class="fas fa-id-card"></i> <span data-i18n="link_cv"></span></a>
                    <a href="https://orcid.org/0000-0002-0945-1495" target="_blank"><i class="fab fa-orcid"></i> ORCID</a>
                    <a href="http://lmdm.biof.ufrj.br/en/" target="_blank"><i class="fas fa-flask"></i> LMDM</a>
                </div>
            </div>
        </div>

        <!-- ===== CONTENT ===== -->
        <div class="content">

            <h3 class="section-title" data-i18n="about_title"></h3>
            <p class="about-text" data-i18n="about_text"></p>
            <div class="keywords-row">
                <span class="keyword-tag" data-i18n="kw_1"></span>
                <span class="keyword-tag" data-i18n="kw_2"></span>
                <span class="keyword-tag" data-i18n="kw_3"></span>
                <span class="keyword-tag" data-i18n="kw_4"></span>
                <span class="keyword-tag" data-i18n="kw_5"></span>
            </div>

            <!-- CV -->
            <h3 class="section-title section-gap" data-i18n="curriculum_title"></h3>
            <div class="repo-grid">
                <a class="repo-card featured" href="https://monteirotorres.github.io/cv/" target="_blank">
                    <div class="repo-icon"><i class="fas fa-id-card"></i></div>
                    <div class="repo-body">
                        <div class="repo-name">CV <i class="fas fa-arrow-right arrow"></i></div>
                        <div class="repo-desc" data-i18n="cv_desc"></div>
                    </div>
                </a>
            </div>

            <!-- SOFTWARE -->
            <h3 class="section-title section-gap" data-i18n="software_title"></h3>
            <div class="repo-grid">

                <a class="repo-card" href="https://github.com/monteirotorres/ProtCHOIR" target="_blank">
                    <div class="repo-icon"><i class="fas fa-cubes"></i></div>
                    <div class="repo-body">
                        <div class="repo-name">ProtCHOIR <i class="fas fa-arrow-right arrow"></i></div>
                        <div class="repo-desc" data-i18n="protchoir_desc"></div>
                    </div>
                </a>

                <a class="repo-card" href="https://github.com/monteirotorres/cvnet" target="_blank">
                    <div class="repo-icon"><i class="fas fa-project-diagram"></i></div>
                    <div class="repo-body">
                        <div class="repo-name">cvnet <i class="fas fa-arrow-right arrow"></i></div>
                        <div class="repo-desc" data-i18n="cvnet_desc"></div>
                    </div>
                </a>

                <a class="repo-card" href="https://github.com/monteirotorres/XtractComments" target="_blank">
                    <div class="repo-icon"><i class="fas fa-file-lines"></i></div>
                    <div class="repo-body">
                        <div class="repo-name">XtractComments <i class="fas fa-arrow-right arrow"></i></div>
                        <div class="repo-desc" data-i18n="xtract_desc"></div>
                    </div>
                </a>

                <a class="repo-card" href="https://github.com/monteirotorres/msa2pdb" target="_blank">
                    <div class="repo-icon"><i class="fas fa-dna"></i></div>
                    <div class="repo-body">
                        <div class="repo-name">msa2pdb <i class="fas fa-arrow-right arrow"></i></div>
                        <div class="repo-desc" data-i18n="msa2pdb_desc"></div>
                    </div>
                </a>

                <a class="repo-card" href="https://github.com/monteirotorres/impyctfactor" target="_blank">
                    <div class="repo-icon"><i class="fas fa-calculator"></i></div>
                    <div class="repo-body">
                        <div class="repo-name">impyctfactor <i class="fas fa-arrow-right arrow"></i></div>
                        <div class="repo-desc" data-i18n="impyct_desc"></div>
                    </div>
                </a>

            </div>

            <!-- MATERIAL DIDÁTICO -->
            <h3 class="section-title section-gap" data-i18n="teaching_title"></h3>
            <div class="repo-grid">

                <a class="repo-card" href="https://monteirotorres.github.io/biostat/" target="_blank">
                    <div class="repo-icon"><i class="fas fa-chart-simple"></i></div>
                    <div class="repo-body">
                        <div class="repo-name"><span data-i18n="biostat_name"></span> <i class="fas fa-arrow-right arrow"></i></div>
                        <div class="repo-desc" data-i18n="biostat_desc"></div>
                    </div>
                </a>

                <a class="repo-card" href="https://monteirotorres.github.io/ml/" target="_blank">
                    <div class="repo-icon"><i class="fas fa-brain"></i></div>
                    <div class="repo-body">
                        <div class="repo-name"><span data-i18n="ml_name"></span> <i class="fas fa-arrow-right arrow"></i></div>
                        <div class="repo-desc" data-i18n="ml_desc"></div>
                    </div>
                </a>

                <a class="repo-card" href="https://monteirotorres.github.io/introprogbiomed/" target="_blank">
                    <div class="repo-icon"><i class="fas fa-code"></i></div>
                    <div class="repo-body">
                        <div class="repo-name"><span data-i18n="introprog_name"></span> <i class="fas fa-arrow-right arrow"></i></div>
                        <div class="repo-desc" data-i18n="introprog_desc"></div>
                    </div>
                </a>

            </div>

        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            © Pedro Henrique Monteiro Torres ·
            <a href="https://github.com/monteirotorres" target="_blank">github.com/monteirotorres</a>
        </div>

    </div>

    <script>
        const I18N = {
            en: {
                role: "Researcher & Adjunct Professor · UFRJ",
                link_cv: "CV",
                about_title: "About",
                about_text: "I am a researcher and Adjunct Professor at the Carlos Chagas Filho Institute of Biophysics (UFRJ), working at the intersection of computational structural biology, molecular modeling, drug design and bioinformatics. This page collects the open-source software and teaching materials I develop and maintain.",
                kw_1: "Structural biology",
                kw_2: "Drug design",
                kw_3: "Bioinformatics",
                kw_4: "Molecular modeling",
                kw_5: "Machine learning",
                curriculum_title: "Curriculum",
                cv_desc: "Interactive, bilingual (Portuguese / English) curriculum vitae with light and dark themes — education, positions, publications, awards and contact.",
                software_title: "Software",
                protchoir_desc: "Protein Complexes and Homo-Oligomeric Interfaces Resolver — proteome-scale generation and analysis of homo-oligomeric protein structures.",
                cvnet_desc: "Takes a list of researcher names and builds a network of their scientific interactions and collaborations.",
                xtract_desc: "Extracts comments and annotations from a PDF file and writes them out to a plain-text file.",
                msa2pdb_desc: "Maps multiple sequence alignment positions and conservation onto the corresponding residues of a PDB structure.",
                impyct_desc: "Python tool for retrieving and working with journal impact factors and related bibliometric data.",
                teaching_title: "Teaching materials",
                biostat_name: "Biostatistics",
                biostat_desc: "Course materials for applied biostatistics — notes and examples for the biosciences.",
                ml_name: "Introduction to Machine Learning",
                ml_desc: "Introductory machine-learning course with hands-on notebooks.",
                introprog_name: "Introduction to Programming",
                introprog_desc: "Material for “Programação para Biociências” (BFB772) and “Computação Científica Aplicada a Biossistemas” (ESB705)."
            },
            pt: {
                role: "Pesquisador & Professor Adjunto · UFRJ",
                link_cv: "Currículo",
                about_title: "Sobre",
                about_text: "Sou pesquisador e Professor Adjunto no Instituto de Biofísica Carlos Chagas Filho (UFRJ), atuando na interseção entre biologia estrutural computacional, modelagem molecular, desenho de fármacos e bioinformática. Esta página reúne os softwares de código aberto e os materiais didáticos que desenvolvo e mantenho.",
                kw_1: "Biologia estrutural",
                kw_2: "Desenho de fármacos",
                kw_3: "Bioinformática",
                kw_4: "Modelagem molecular",
                kw_5: "Aprendizagem de máquina",
                curriculum_title: "Currículo",
                cv_desc: "Currículo interativo e bilíngue (português / inglês) com temas claro e escuro — formação, cargos, publicações, prêmios e contato.",
                software_title: "Software",
                protchoir_desc: "Protein Complexes and Homo-Oligomeric Interfaces Resolver — geração e análise, em escala de proteoma, de estruturas de proteínas homo-oligoméricas.",
                cvnet_desc: "Recebe uma lista de nomes de pesquisadores e constrói uma rede de suas interações e colaborações científicas.",
                xtract_desc: "Extrai comentários e anotações de um arquivo PDF e os salva em um arquivo de texto simples.",
                msa2pdb_desc: "Mapeia posições e conservação de um alinhamento múltiplo de sequências sobre os resíduos correspondentes de uma estrutura PDB.",
                impyct_desc: "Ferramenta em Python para obter e trabalhar com fatores de impacto de periódicos e dados bibliométricos relacionados.",
                teaching_title: "Material didático",
                biostat_name: "Bioestatística",
                biostat_desc: "Material didático de bioestatística aplicada — notas e exemplos para as biociências.",
                ml_name: "Introdução à Aprendizagem de Máquina",
                ml_desc: "Curso de aprendizagem de máquina básico, com notebooks práticos.",
                introprog_name: "Introdução à Programação",
                introprog_desc: "Material das disciplinas “Programação para Biociências” (BFB772) e “Computação Científica Aplicada a Biossistemas” (ESB705)."
            }
        };

        function setLanguage(lang) {
            const dict = I18N[lang] || I18N.en;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key] !== undefined) el.textContent = dict[key];
            });
            document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
            ['pt', 'en'].forEach(l => document.getElementById('flag-' + l).classList.remove('active'));
            document.getElementById('flag-' + lang).classList.add('active');
            localStorage.setItem('cv-lang', lang);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            document.getElementById('theme-icon').className = isDark ? 'fas fa-moon' : 'fas fa-sun';
            localStorage.setItem('cv-theme', newTheme);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('cv-theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('theme-icon').className = savedTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            const savedLang = localStorage.getItem('cv-lang') || 'en';
            setLanguage(savedLang);
        });
    </script>
</body>
</html>
